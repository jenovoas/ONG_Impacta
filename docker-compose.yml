services:
  postgres:
    image: postgres:16-alpine
    container_name: impacta-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=impacta
      - POSTGRES_USER=impacta
      - POSTGRES_PASSWORD=impacta_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impacta -d impacta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: impacta-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data:z
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: impacta-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://impacta:impacta_pass@postgres:5432/impacta?schema=public
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api-impacta.pinguinoseguro.cl
    container_name: impacta-frontend
    restart: unless-stopped

  landing:
    image: localhost/ong_impacta_landing:latest
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: impacta-landing
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BACKEND_URL: https://api-impacta.pinguinoseguro.cl
    ports:
      - "3080:3000"
    restart: unless-stopped

networks:
  default:

volumes:
  postgres_data:
  redis_data:
