# Configuración de Nginx para Impacta+ en el host de borde (Kingu - 10.88.0.2).
# Separación estricta Front/Back:
#  - Frontend: archivos estáticos servidos desde /var/www/impacta.pinguinoseguro.cl
#  - Backend: proxy inverso sobre WireGuard hacia Fenix (10.88.0.1:3102)

server {
    listen 80;
    listen [::]:80;
    server_name impacta.pinguinoseguro.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name impacta.pinguinoseguro.cl;

    root /var/www/impacta.pinguinoseguro.cl;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/impacta.pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/impacta.pinguinoseguro.cl/privkey.pem;

    location /api/ {
        proxy_pass http://10.88.0.1:3102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
