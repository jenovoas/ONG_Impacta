# Marketing site — React frontend (Three.js Earth + logo.png + rich content)
# Served as static files; same setup as app-impacta.pinguinoseguro.cl
server {
    server_name impacta.pinguinoseguro.cl;

    root /var/www/impacta.pinguinoseguro.cl;
    index index.html;

    # Proxy API requests to the backend (trailing slash strips /api/ prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash del build: caché larga e immutable.
    # index.html SIEMPRE revalida para que los deploys lleguen sin bundles viejos.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Dashboard app — React static (nginx serves /var/www/impacta.pinguinoseguro.cl)
server {
    server_name app-impacta.pinguinoseguro.cl;

    root /var/www/impacta.pinguinoseguro.cl;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# API — backend (NestJS at port 3001)
server {
    server_name api-impacta.pinguinoseguro.cl;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    server_name impacta.pinguinoseguro.cl app-impacta.pinguinoseguro.cl api-impacta.pinguinoseguro.cl;
    listen 80;
    return 301 https://$host$request_uri;
}
