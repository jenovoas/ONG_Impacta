# Copia versionada de la config nginx activa de Impacta+.
# Origen vivo: /etc/nginx/http.d/impacta.conf (verificado 21-oct-2026).
# Difiere del layout antiguo conf.d + /var/www: este host sirve el frontend
# directo desde frontend/dist del repo y no usa systemd.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name impacta.pinguinoseguro.cl app-impacta.pinguinoseguro.cl;

    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;

    root /home/jnovoas/proyectos/ONG_Impacta/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend NestJS en 127.0.0.1:3101 (puerto 3001 ocupado por Grafana/sentinel).
    # Sin prefijo global en Nest: se recorta /api/ al proxear.
    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
