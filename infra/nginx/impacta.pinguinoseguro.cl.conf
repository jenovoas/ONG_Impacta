# Dominio único — https://impacta.pinguinoseguro.cl sirve TODO lo usuario-facing
# (landing + login/register + dashboard). Regla #1 — un solo dominio.
server {
    server_name impacta.pinguinoseguro.cl;

    root /var/www/impacta.pinguinoseguro.cl;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Legado — app-impacta.pinguinoseguro.cl solo redirige (bookmarks/DNS viejos)
# No sirve contenido. Evita duplicados que confunden agentes y usuarios.
server {
    server_name app-impacta.pinguinoseguro.cl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://impacta.pinguinoseguro.cl$request_uri;
}

# API — backend (NestJS at port 3001)
server {
    server_name api-impacta.pinguinoseguro.cl;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pinguinoseguro.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinguinoseguro.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    server_name impacta.pinguinoseguro.cl app-impacta.pinguinoseguro.cl api-impacta.pinguinoseguro.cl;
    listen 80;
    return 301 https://$host$request_uri;
}
