# Override de producción — host Fenix (Ubuntu 24.04).
# Uso: ./deploy.sh backend
# Difiere del compose base (dev):
#  - backend interno en 3101; host solo por WireGuard en 10.88.0.1:3102
#  - PostgreSQL/Redis publicados solo en loopback para administración local
#  - sin sufijos :z (son de podman/SELinux; Alpine+docker no los usa)
# Requiere .env en la raíz con JWT_SECRET (+ OAuth si aplica).
# DATABASE_URL/REDIS_URL ya apuntan a los servicios internos del compose.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports: !override
      - "127.0.0.1:6381:6379"
    volumes:
      - redis_data:/data

  backend:
    ports: !override
      - "10.88.0.1:3102:3101"
    environment:
      NODE_ENV: production
      PORT: 3101
