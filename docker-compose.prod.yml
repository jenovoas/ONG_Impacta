# Override de producción — host Alpine (fenix).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build backend
# Difiere del compose base (dev):
#  - backend en 3101 (según configuración de despliegue vigente)
#  - sin sufijos :z (son de podman/SELinux; Alpine+docker no los usa)
# Requiere .env en la raíz con JWT_SECRET (+ OAuth si aplica).
# DATABASE_URL/REDIS_URL ya apuntan a los servicios internos del compose.
services:
  postgres:
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

  backend:
    ports: !override
      - "3102:3101"
    environment:
      NODE_ENV: production
      PORT: 3101
