    <title>Impacta+ | Plataforma digital para ONGs</title>
    <script>
      // Regla #1 (AGENTS.md): landing pública en impacta.*, dashboard en app-impacta.*
      // Título correcto por dominio — el mismo build sirve ambos sitios.

        var h = location.hostname;
        if (h.startsWith('app-')) {
          document.title = 'Impacta+ | Dashboard';
        }
      })();
    </script>
